<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <rect width="120" height="120" rx="28" fill="url(#avatarGrad)" />
  <rect x="6" y="6" width="108" height="108" rx="22" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2" />
  <!-- Scales of Justice & Code Monogram -->
  <g transform="translate(60, 52)">
    <!-- Scale beam -->
    <path d="M-24 -12 L24 -12" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <!-- Center pillar -->
    <path d="M0 -18 L0 26" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <circle cx="0" cy="-18" r="3.5" fill="#f59e0b" />
    <!-- Scale Left Pan -->
    <path d="M-24 -12 L-32 2 L-16 2 Z" fill="rgba(56, 189, 248, 0.2)" stroke="#38bdf8" stroke-width="1.8" />
    <!-- Scale Right Pan -->
    <path d="M24 -12 L16 2 L32 2 Z" fill="rgba(56, 189, 248, 0.2)" stroke="#38bdf8" stroke-width="1.8" />
    <!-- Base -->
    <path d="M-12 26 L12 26" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
  </g>
  <!-- Monogram text -->
  <text x="60" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="2">AMINUL</text>
</svg>
